<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huellas de Amor</title>

  <!-- FontAwesome Icons (para los iconos de búsqueda, corazón, usuario y huellita) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Tipografías de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Quicksand:wght@600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- ===== HEADER / NAVBAR ===== -->
  <header class="header">
    <nav class="navbar">
        
        <!-- Logo -->
        <div class="logo">
            <!-- Icono de huella (si no tienes la imagen local, usa la huellita de respaldo) -->
            <img src="imagenes/huellas.png" alt="Huella" class="logo-icon" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/616/616408.png';">
            <div class="logo-text">
                <span class="brand-name">Huellas de Amor</span>
                <span class="tagline">Adopta · Cuida · Cambia una vida</span>
            </div>
        </div>

        <!-- Menú de navegación -->
        <ul class="nav-links">
            <li><a href="#" class="active">Inicio</a></li>
            <li><a href="#">Mascotas</a></li>
            <li><a href="#">Favoritos</a></li>
            <li><a href="#">Galería</a></li>
            <li><a href="#">Sobre nosotros</a></li>
        </ul>

        <!-- Iconos de acción -->
        <div class="nav-actions">
            <!-- Buscar -->
            <button class="icon-btn" aria-label="Buscar">
                <i class="fas fa-search"></i>
            </button>

            <!-- Favoritos con contador -->
            <button class="icon-btn" aria-label="Favoritos">
                <i class="fas fa-heart"></i>
                <span class="badge">3</span>
            </button>

            <!-- Perfil de usuario -->
            <button class="icon-btn" aria-label="Perfil">
                <i class="fas fa-user"></i>
            </button>
        </div>

    </nav>
  </header>

  <!-- ===== AQUI TRABAJA ADRIAN ===== -->
  <section class="banner">
    <div class="banner-contenedor">
      
      <!-- Contenido Izquierdo (Texto y Botón) -->
      <div class="columna-texto">
        <h1 class="titulo">
          Ellos también<br>
          merecen un <span class="palabra-hogar">hogar <span class="corazon-icono">♡</span></span>
        </h1>

        <p class="subtitulo">
          Adopta una mascota y dale una segunda<br>
          oportunidad a una vida llena de amor.
        </p>

        <a href="#mascotas" class="boton-verde">
          <i class="fas fa-paw"></i> Ver mascotas <i class="fas fa-arrow-right"></i>
        </a>
      </div>

      <!-- Contenido Derecho (Imagen y Texto manuscrito) -->
      <div class="columna-imagen">
        <div class="caja-foto">
          <!-- Si la imagen local imagenes/banner-mascotas.png aún no existe, cargará automáticamente la foto de muestra -->
          <img src="imagenes/banner-mascotas.png" 
               alt="Perro y gato en adopción" 
               class="foto-perro" 
               onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1548767797-d8c844163c4c?auto=format&fit=crop&w=1200&q=80';">

          <!-- Texto manuscrito sobre la imagen -->
          <div class="frase-flotante">
            Una adopción<br>cambia dos vidas 🐾
          </div>
        </div>
      </div>

    </div>
  </section>
  <!-- ===== FIN SECCIÓN ADRIAN ===== -->

  <main>
    <!-- Aqui trabaja Felipe -->
  </main>

  <footer>
    <!-- Aqui trabaja Andrea -->
  </footer>

</body>
</html>
