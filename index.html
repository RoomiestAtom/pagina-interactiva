  <title>Huellas de Amor</title>
</head>
<body>
    <!-- ===== HEADER / NAVBAR ===== -->
<header class="header">

        <!-- Logo -->
        <div class="logo">
            <!-- Icono de huella (puedes usar una imagen PNG/SVG) -->
            <img src="img/paw-icon.png" alt="Huella" class="logo-icon">
            <div class="logo-text">
                <span class="brand-name">Huellas de Amor</span>
                <span class="tagline">Adopta · Cuida · Cambia una vida</span>
            </div>
        </div>

        <!-- Menú de navegación -->

        <div class="nav-actions">
            <!-- Buscar -->
            <button class="icon-btn" aria-label="Buscar">
                <i class="fas fa-search"></i>
            </button>

            <!-- Favoritos con contador -->
            <button class="icon-btn" aria-label="Favoritos">
                <i class="fas fa-heart"></i>
                <span class="badge">3</span>
            </button>

            <!-- Perfil de usuario -->
            <button class="icon-btn" aria-label="Perfil">
